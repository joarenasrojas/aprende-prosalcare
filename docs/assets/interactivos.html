<script>
/* Interactivos de los módulos: cronómetro de práctica y autoevaluación. Sin dependencias ni datos enviados a ningún servidor. */
(function () {
  // Animaciones de los pasos: se reproducen solo mientras están a la vista
  var vids = document.querySelectorAll("video.paso-vid");
  if ("IntersectionObserver" in window && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { var pr = e.target.play(); if (pr && pr.catch) pr.catch(function () {}); } else e.target.pause(); }); }, { threshold: 0.4 });
    vids.forEach(function (v) { io.observe(v); });
  } else vids.forEach(function (v) { v.controls = true; });
  // Cronómetro: <div class="practica" data-pasos='[["Texto del paso", segundos], ...]'>
  document.querySelectorAll(".practica").forEach(function (box) {
    var pasos = JSON.parse(box.getAttribute("data-pasos") || "[]");
    var total = pasos.reduce(function (a, p) { return a + p[1]; }, 0);
    box.innerHTML = '<div class="ahora" aria-live="polite">Practica con el cronómetro: te guía paso a paso.</div>' +
      '<div class="barra" aria-hidden="true"><i></i></div><div class="seg">0 de ' + total + ' segundos</div>' +
      '<button type="button">Comenzar</button>';
    var ahora = box.querySelector(".ahora"), barra = box.querySelector(".barra i"), seg = box.querySelector(".seg"), btn = box.querySelector("button");
    var timer = null, t0 = 0;
    function parar(msg) { clearInterval(timer); timer = null; btn.textContent = "Repetir"; if (msg) ahora.textContent = msg; }
    function tick() {
      var t = (Date.now() - t0) / 1000, acc = 0, i;
      if (t >= total) { barra.style.width = "100%"; seg.textContent = total + " de " + total + " segundos"; parar("Listo. Así de largo es un buen lavado."); return; }
      for (i = 0; i < pasos.length; i++) { if (t < acc + pasos[i][1]) break; acc += pasos[i][1]; }
      ahora.textContent = (i + 1) + ". " + pasos[i][0];
      barra.style.width = (100 * t / total) + "%"; seg.textContent = Math.floor(t) + " de " + total + " segundos";
    }
    btn.addEventListener("click", function () {
      if (timer) { parar("Pausado. Puedes repetir cuando quieras."); return; }
      t0 = Date.now(); btn.textContent = "Detener"; tick(); timer = setInterval(tick, 200);
    });
  });
  // Autoevaluación: <div class="quiz"> con <fieldset data-ok="índice" data-por="explicación">
  document.querySelectorAll(".quiz fieldset").forEach(function (fs, n) {
    var ok = parseInt(fs.getAttribute("data-ok"), 10), por = fs.getAttribute("data-por") || "";
    var out = document.createElement("div"); out.className = "resp"; out.hidden = true; out.setAttribute("aria-live", "polite"); fs.appendChild(out);
    fs.querySelectorAll("input").forEach(function (inp, i) {
      inp.name = "q" + n; inp.id = "q" + n + "-" + i;
      inp.addEventListener("change", function () {
        out.hidden = false; out.className = "resp " + (i === ok ? "ok" : "no");
        out.textContent = (i === ok ? "Correcto. " : "Todavía no. ") + por;
      });
    });
  });
})();
</script>
